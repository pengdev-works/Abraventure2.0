version: '3.8'

services:
  # ── PostgreSQL Database ──────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: abraventure_db
    restart: always
    environment:
      POSTGRES_USER: abra_admin
      POSTGRES_PASSWORD: abra_secure_password_2026
      POSTGRES_DB: abraventure_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/schema.sql

  # ── Express API Backend ──────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: abraventure_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: postgres://abra_admin:abra_secure_password_2026@postgres:5432/abraventure_db
      JWT_SECRET: supersecretkeyforabraventure2026
    depends_on:
      - postgres

  # ── Vite Nginx Frontend ─────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: abraventure_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
